services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Wyrenderowane PDF (scripts/generate_demo_invoice.py) lądują na hoście do podejrzenia.
      - ./out:/app/out
    depends_on:
      - redis
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    env_file: .env
    depends_on:
      - redis
    command: celery -A tasks.celery_tasks worker --beat --loglevel=info

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  frontend:
    build: ./frontend
    ports:
      - "3000:80"

volumes:
  redis_data:
